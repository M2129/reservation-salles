server {
    listen 80;
    server_name localhost;

    # Racine publique de l'application — seul ce dossier est exposé.
    root /var/www/html/public;
    index index.php;

    # Toutes les routes qui ne correspondent pas à un fichier existant
    # sont envoyées vers le Front Controller (public/index.php), qui
    # se chargera du dispatch via FastRoute (à partir de la Phase 12).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Transmission des fichiers .php à PHP-FPM (service "app", port 9000).
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Fichiers statiques (CSS, JS, images) : mise en cache basique.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Sécurité : empêcher tout accès direct à des fichiers sensibles
    # (dotfiles, configuration, dépendances Composer, etc.).
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(vendor|config|src|routes|database|tests)/ {
        deny all;
    }

    location = /composer.json { deny all; }
    location = /composer.lock { deny all; }
    location = /.env         { deny all; }

    client_max_body_size 10M;
}
